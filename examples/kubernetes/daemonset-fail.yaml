# Fails some Kubernetes policies — a typical "node agent" that asks for too much:
#   no_privileged_containers  1 finding  (allowPrivilegeEscalation on "agent")
#   no_latest_tag             0 findings
#   resource_limits_required  0 findings
#   no_hostpath               2 findings (volumes "proc" and "docker-sock")
#   required_labels           1 finding  (owner missing)
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-agent
  namespace: monitoring
  labels:
    app.kubernetes.io/name: node-agent
    environment: prod
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: node-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: node-agent
    spec:
      containers:
        - name: agent
          image: registry.northwind.example/platform/node-agent:1.4.2
          securityContext:
            allowPrivilegeEscalation: true
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: proc
              mountPath: /host/proc
              readOnly: true
            - name: docker-sock
              mountPath: /var/run/docker.sock
      volumes:
        - name: proc
          hostPath:
            path: /proc
        - name: docker-sock
          hostPath:
            path: /var/run/docker.sock
