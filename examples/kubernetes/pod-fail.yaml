# Fails every Kubernetes policy in policies/opa/kubernetes:
#   no_privileged_containers  2 findings (privileged + allowPrivilegeEscalation on "shell")
#   no_latest_tag             2 findings ("ubuntu" has no tag, "busybox:latest")
#   resource_limits_required  4 findings ("shell" has no limits or requests)
#   no_hostpath               1 finding  (volume "host-root")
#   required_labels           3 findings (name and owner missing, environment not allowed)
apiVersion: v1
kind: Pod
metadata:
  name: debug-shell
  namespace: default
  labels:
    environment: production
spec:
  containers:
    - name: shell
      image: ubuntu
      command: ["sleep", "infinity"]
      securityContext:
        privileged: true
        allowPrivilegeEscalation: true
      volumeMounts:
        - name: host-root
          mountPath: /host
    - name: sidecar
      image: busybox:latest
      resources:
        limits:
          cpu: 100m
          memory: 64Mi
        requests:
          cpu: 50m
          memory: 32Mi
  volumes:
    - name: host-root
      hostPath:
        path: /
