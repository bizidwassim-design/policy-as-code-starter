# Checkov custom policy (YAML graph check, connection type).
# Every S3 bucket must be connected to an aws_s3_bucket_public_access_block
# (the block references the bucket). Mirrors the OPA policy
# terraform/s3_blob_public_access_blocked for teams scanning HCL rather than plans.
#
# Controls: CIS AWS Foundations Benchmark 2.1.4 · ISO/IEC 27001:2022 A.8.3 · NIST CSF 2.0 PR.AA-05
metadata:
  id: "CKV2_CUSTOM_2"
  name: "Ensure every S3 bucket has a public access block attached"
  category: "GENERAL_SECURITY"
  severity: "HIGH"
  guideline: "https://github.com/bizidwassim-design/policy-as-code-starter/blob/main/docs/policy-catalogue.md"
scope:
  provider: "aws"
definition:
  cond_type: "connection"
  resource_types:
    - "aws_s3_bucket"
  connected_resource_types:
    - "aws_s3_bucket_public_access_block"
  operator: "exists"
